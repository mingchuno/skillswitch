name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish or retry (empty runs release-please)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'mingchuno/skillswitch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create release App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Update release PR and create merged release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: [verify, release]
    if: >-
      always() && needs.verify.result == 'success' &&
      vars.NPM_PUBLISH_ENABLED == 'true' &&
      (needs.release.outputs.created == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release.outputs.tag }}
      RELEASE_SHA: ${{ needs.release.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || needs.release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft == false' | grep -qx true
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          if [[ -n "$RELEASE_SHA" ]]; then
            test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (pkg.name !== "@mingchuno/skillswitch" || `v${pkg.version}` !== process.env.RELEASE_TAG) {
              throw new Error("Package name/version does not match the release");
            }
          '
      - run: pnpm install --frozen-lockfile
      - name: Verify exact release commit
        run: pnpm verify
      - name: Pack and test installed CLI
        shell: bash
        run: |
          set -euo pipefail
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/pack.json"
          tarball=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.env.RUNNER_TEMP + "/pack.json", "utf8"))[0].filename')
          echo "RELEASE_TARBALL=$RUNNER_TEMP/$tarball" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/smoke" --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/$tarball"
          test "$("$RUNNER_TEMP/smoke/node_modules/.bin/skillswitch" --version)" = "${RELEASE_TAG#v}"
          "$RUNNER_TEMP/smoke/node_modules/.bin/skillswitch" --help
      - name: Publish tested tarball with npm OIDC
        run: npm publish "$RELEASE_TARBALL" --access public --provenance
